name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert reproducible Node install
        run: |
          test -f package-lock.json
          grep -q "npm ci" Dockerfile

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-dev.txt
          npm ci

      - name: Run pyright
        run: |
          .venv/bin/pyright --level error
      - name: Run pyright for tests
        run: |
          .venv/bin/pyright --project pyrightconfig.tests.json --level error

      - name: Run pytest
        timeout-minutes: 10
        env:
          PYTHONWARNINGS: "ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning"
        run: |
          .venv/bin/pytest -q -W error tests/

      - name: Run biomedical mock eval
        run: |
          .venv/bin/python -m eval.biomed_evidence.run_eval --output /tmp/biomed_eval_results.json

      - name: Frontend typecheck
        run: |
          npm run typecheck

      - name: Frontend build
        run: |
          npm run build

      - name: Docker build
        run: |
          docker build -t akashic-biomed-agent .
